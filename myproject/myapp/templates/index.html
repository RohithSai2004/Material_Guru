<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Guru</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(120deg, #ece9e6, #ffffff);
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            margin-top: 100px;
            opacity: 0;
            transform: scale(0.8);
            animation: fadeIn 1.2s ease-out forwards 1s;
        }

        header {
            background: linear-gradient(90deg, #003973, #E5E5BE);
            color: #fff;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        .regulation-selector {
            margin: 25px 0;
        }

        select {
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #003973;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s, background-color 0.3s;
            background: #f5f5f5;
        }

        select:hover {
            border-color: #005F73;
            background: #e8f0f9;
        }

        .branch-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .branch-box {
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .branch-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .branch-box:nth-child(odd) {
            background: linear-gradient(45deg, #43cea2, #185a9d);
        }

        /* Welcome Animation */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, #003973, #185a9d);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 2rem;
            animation: slideUp 1s ease-out forwards 2s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideUp {
            to {
                transform: translateY(-100%);
            }
        }
    </style>
</head>
<body>
    <!-- Welcome Screen -->
    <div class="welcome-screen">
        Welcome to Material Guru, Your Semester Companion!
    </div>

    <div class="container">
        <header>
            <h1>Material Guru</h1>
        </header>

        <div class="regulation-selector">
            <label for="regulations"><strong>Select a Regulation:</strong></label>
            <select id="regulations">
                <option value="">-- Select Regulation --</option>
                <option value="MIC18">MIC18</option>
                <option value="MIC20">MIC20</option>
                <option value="MIC23">MIC23</option>
            </select>
        </div>

        <div class="branch-container" id="branch-container">
            <!-- Branch boxes will be dynamically generated here -->
        </div>
    </div>

    <script>
        // Event listener for regulation selection
        document.getElementById('regulations').addEventListener('change', function () {
            const selectedRegulation = this.value;
            const branchContainer = document.getElementById('branch-container');
            branchContainer.innerHTML = ''; // Clear any existing branches

            // List of branches
            const branches = ['AID', 'AIM', 'CIV', 'CSE', 'ECE', 'EEE', 'MECH', 'MBA', 'MTECH', 'MCA'];

            // Create branch boxes dynamically
            if (selectedRegulation) {
                branches.forEach(branch => {
                    const branchBox = document.createElement('div');
                    branchBox.className = 'branch-box';
                    branchBox.textContent = branch;

                    // Redirect on branch selection
                    branchBox.onclick = () => {
                        const url = `/sem/?regulation=${selectedRegulation}&branch=${branch}`;
                        window.location.href = url;
                    };

                    branchContainer.appendChild(branchBox);
                });
            }
        });
    </script>
</body>
</html>
